<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#151230"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="66" fill="#f4f5f7" font-size="34" font-weight="700">🛡️ Quality Guardian</text>
  <text x="60" y="96" fill="#9aa3b5" font-size="16">
    Stateful LangGraph agent · explicit state machine · self-correction · human-in-the-loop
  </text>

  <!-- ═══ row 1: main spine ═══ -->
  <!-- check_schema -->
  <rect x="40" y="200" width="150" height="70" rx="12" fill="#141926" stroke="#22d3ee" stroke-width="2"/>
  <text x="115" y="230" fill="#e8ecf3" font-size="20" text-anchor="middle">🔍</text>
  <text x="115" y="252" fill="#c7ccd6" font-size="13" text-anchor="middle">check_schema</text>

  <!-- validate_rules -->
  <rect x="230" y="200" width="150" height="70" rx="12" fill="#141926" stroke="#eab308" stroke-width="2"/>
  <text x="305" y="230" fill="#e8ecf3" font-size="20" text-anchor="middle">📋</text>
  <text x="305" y="252" fill="#c7ccd6" font-size="13" text-anchor="middle">validate_rules</text>

  <!-- score -->
  <rect x="420" y="200" width="150" height="70" rx="12" fill="#141926" stroke="#d946ef" stroke-width="2"/>
  <text x="495" y="230" fill="#e8ecf3" font-size="20" text-anchor="middle">⚖️</text>
  <text x="495" y="252" fill="#c7ccd6" font-size="13" text-anchor="middle">score</text>
  <!-- decide badge -->
  <g>
    <circle cx="465" cy="285" r="4" fill="#22c55e"/>
    <circle cx="495" cy="285" r="4" fill="#eab308"/>
    <circle cx="525" cy="285" r="4" fill="#ef4444"/>
  </g>

  <!-- human_gate -->
  <rect x="620" y="200" width="170" height="70" rx="12" fill="#1c1420" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="705" y="230" fill="#e8ecf3" font-size="20" text-anchor="middle">⏸️</text>
  <text x="705" y="252" fill="#f0c9cf" font-size="13" text-anchor="middle">human_gate</text>
  <!-- paused badge -->
  <rect x="655" y="150" width="100" height="26" rx="13" fill="#3a1420" stroke="#ef4444" stroke-width="1.5"/>
  <text x="705" y="167" fill="#ff8fa3" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">PAUSED</text>
  <line x1="705" y1="176" x2="705" y2="198" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- recommend -->
  <rect x="840" y="200" width="150" height="70" rx="12" fill="#141926" stroke="#3b82f6" stroke-width="2"/>
  <text x="915" y="230" fill="#e8ecf3" font-size="20" text-anchor="middle">🧠</text>
  <text x="915" y="252" fill="#c7ccd6" font-size="13" text-anchor="middle">recommend</text>

  <!-- write_ledger -->
  <rect x="1030" y="200" width="130" height="70" rx="12" fill="#141926" stroke="#22c55e" stroke-width="2"/>
  <text x="1095" y="230" fill="#e8ecf3" font-size="20" text-anchor="middle">💾</text>
  <text x="1095" y="252" fill="#c7ccd6" font-size="13" text-anchor="middle">write_ledger</text>

  <!-- row1 arrows -->
  <line x1="190" y1="235" x2="226" y2="235" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="235" x2="416" y2="235" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="235" x2="616" y2="235" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="235" x2="836" y2="235" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="235" x2="1026" y2="235" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══ row 2: self-correction loop ═══ -->
  <!-- optimize -->
  <rect x="420" y="400" width="150" height="70" rx="12" fill="#141926" stroke="#eab308" stroke-width="2"/>
  <text x="495" y="430" fill="#e8ecf3" font-size="20" text-anchor="middle">🛠️</text>
  <text x="495" y="452" fill="#c7ccd6" font-size="13" text-anchor="middle">optimize</text>

  <!-- evaluate -->
  <rect x="620" y="400" width="170" height="70" rx="12" fill="#141926" stroke="#d946ef" stroke-width="2"/>
  <text x="705" y="430" fill="#e8ecf3" font-size="20" text-anchor="middle">🧪</text>
  <text x="705" y="452" fill="#c7ccd6" font-size="13" text-anchor="middle">evaluate</text>

  <!-- score -> optimize (yellow path) -->
  <path d="M 480 270 L 480 396" fill="none" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="454" y="340" fill="#c9a227" font-size="11" text-anchor="middle">yellow</text>

  <!-- optimize -> evaluate -->
  <line x1="570" y1="435" x2="616" y2="435" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- evaluate -> validate_rules (accepted, health rises) -->
  <path d="M 660 396 C 560 300, 420 260, 384 244" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <text x="300" y="292" fill="#4ade80" font-size="11" text-anchor="middle">accepted, health rises</text>

  <!-- evaluate -> optimize (rejected, retry) -->
  <path d="M 654 470 C 600 500, 545 500, 500 472" fill="none" stroke="#5b6478" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="577" y="512" fill="#8b93a5" font-size="10" text-anchor="middle">rejected · retry</text>

  <!-- evaluate -> human_gate (budget exhausted, escalate) -->
  <path d="M 730 396 C 740 340, 725 290, 710 274" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDashed)"/>
  <text x="800" y="345" fill="#f08a97" font-size="10" text-anchor="middle">MAX_RETRIES</text>

  <!-- caption -->
  <text x="60" y="580" fill="#7b8496" font-size="14">check_schema → validate_rules → score → (route) → optimize ⇄ evaluate → human_gate → recommend → write_ledger</text>
  <text x="60" y="604" fill="#4ade80" font-size="13" font-weight="600">quality_flag written to the W01 Ledger — the trigger the W03 Crew watches for</text>
</svg>
